# DeltaFront: the public (edge) nginx of the single-server deployment.
# docs/Deployment.md explains the layout. Install as
# /etc/nginx/conf.d/deltafront.conf after replacing every example.com with your
# domain (sed -i 's/example\.com/your-domain.tld/g'), then:
#     nginx -t && systemctl reload nginx
#
# Listens on 80/443 only. Behind it, on loopback:
#     127.0.0.1:3080  the game container (its own nginx + the Node game server)
#     127.0.0.1:8787  the account API
# Nothing else is reachable from outside: PostgreSQL listens on loopback too.

# WebSocket upgrade for the game sockets (/w0, /w1, ...).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Abuse brakes in front of the application's own rate limits.
limit_req_zone $binary_remote_addr zone=df_api:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=df_auth:10m rate=5r/s;
limit_req_status 429;

upstream df_game { server 127.0.0.1:3080; keepalive 32; }
upstream df_api  { server 127.0.0.1:8787; keepalive 32; }

# ---------------------------------------------------------------- http -> https
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com api.example.com;
    server_tokens off;

    # Let's Encrypt (certbot --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ------------------------------------------------------ shared TLS settings
# (repeated per server block: nginx has no way to include a snippet that sets
# ssl_certificate for two different names)

# ------------------------------------------------------------- the site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # The edge owns HSTS; the upstream's own header is dropped so it is sent once.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    # The game page, assets, /api/* and the WebSockets all go to the game
    # container, which routes /wN/ to its workers.
    location / {
        proxy_pass http://df_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, never append: a client-supplied X-Forwarded-For must not
        # reach the application, which uses it for rate limits and bans.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A game socket stays open for the length of a match.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Liveness of the game server for external monitors.
    location = /api/health {
        proxy_pass http://df_game;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------ the account API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    # Readiness is for the machine's own monitor, not the internet: it names
    # which subsystem is failing.
    location = /ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://df_api;
    }

    # A finished game, posted by the game server (up to 100 MB of replay data).
    location ^~ /game/ {
        client_max_body_size 100m;
        proxy_request_buffering on;
        limit_req zone=df_api burst=60 nodelay;
        proxy_pass http://df_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Sign-in, session refresh: the tightest brake.
    location ^~ /auth/ {
        limit_req zone=df_auth burst=20 nodelay;
        proxy_pass http://df_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=df_api burst=60 nodelay;
        proxy_pass http://df_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
